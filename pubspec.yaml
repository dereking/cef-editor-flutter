name: cef_editor
description: >-
  Cross-platform rich text (TinyMCE) editor for Flutter. Desktop uses CEF via
  webview_cef, mobile uses native webviews, web uses an iframe — all sharing
  the same TinyMCE editor core and JS bridge protocol.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  webview_cef:
    git:
      url: git@github.com:dereking/webview_cef.git
      ref: master
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: CefEditorPluginCApi
  assets:
    - web_editor/dist/assets/index-decyLKxL.js
    - web_editor/dist/index.html
    - web_editor/dist/skins/content/dark/content.css
    - web_editor/dist/skins/content/dark/content.js
    - web_editor/dist/skins/content/dark/content.min.css
    - web_editor/dist/skins/content/default/content.css
    - web_editor/dist/skins/content/default/content.js
    - web_editor/dist/skins/content/default/content.min.css
    - web_editor/dist/skins/content/document/content.css
    - web_editor/dist/skins/content/document/content.js
    - web_editor/dist/skins/content/document/content.min.css
